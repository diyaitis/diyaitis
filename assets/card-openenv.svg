<svg width="1200" height="168" viewBox="0 0 1200 168" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#131826"/>
      <stop offset="100%" stop-color="#171E30"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="168" rx="16" fill="url(#bg3)"/>
  <rect width="1200" height="168" rx="16" fill="none" stroke="#232A3D" stroke-width="1.5"/>
  <rect x="0" y="20" width="6" height="128" rx="3" fill="#8B5CF6"/>

  <text x="48" y="52" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#F1F5F9">Resume Screening OpenEnv</text>
  <rect x="984" y="30" width="168" height="26" rx="13" fill="#0F2A22" stroke="#1F5C46"/>
  <circle cx="1000" cy="43" r="4" fill="#34D399"/>
  <text x="1012" y="47" font-family="Consolas, Menlo, monospace" font-size="11" font-weight="700" fill="#34D399">LIVE DEMO</text>

  <text x="48" y="82" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" fill="#94A3B8">An agentic evaluation environment: an LLM agent reads a resume and job description,</text>
  <text x="48" y="102" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" fill="#94A3B8">then decides shortlist or reject &#8212; scored both programmatically and by an LLM judge,</text>
  <text x="48" y="122" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" fill="#94A3B8">deployed as a live agent-decision API on Hugging Face Spaces.</text>

  <g font-family="Consolas, Menlo, monospace" font-size="12" font-weight="600">
